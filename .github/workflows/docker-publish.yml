name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
      - dev
      - dev2
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      alias: ${{ steps.version.outputs.alias }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            ALIAS="latest"
          else
            BRANCH=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
            VERSION="${BRANCH}-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
            # main keeps the moving latest tag; each development branch publishes
            # its own moving tag. Any other branch, which only a manual dispatch
            # can build, gets its dated version alone so it can never move
            # latest.
            case "$BRANCH" in
              main) ALIAS="latest" ;;
              dev) ALIAS="dev" ;;
              dev2) ALIAS="dev2" ;;
              *) ALIAS="" ;;
            esac
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "$VERSION" > VERSION
          echo "Building version: $VERSION for ${{ matrix.arch }}"

      - name: Normalize image name
        id: image
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Resolve build tags
        id: tags
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          ALIAS: ${{ steps.version.outputs.alias }}
          ARCH: ${{ matrix.arch }}
        run: |
          TAGS="${IMAGE}:${VERSION}-${ARCH}"
          if [ -n "$ALIAS" ]; then
            TAGS="${TAGS},${IMAGE}:${ALIAS}-${ARCH}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${TAGS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.image }}

      - name: Build & push single-arch
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Docker Image (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  create_manifest:
    name: Create multi-arch manifest
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest (version)
        env:
          IMAGE: ${{ needs.build_single_arch.outputs.image }}
          VERSION: ${{ needs.build_single_arch.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

      - name: Create & push manifest (latest or dev)
        if: needs.build_single_arch.outputs.alias != ''
        env:
          IMAGE: ${{ needs.build_single_arch.outputs.image }}
          ALIAS: ${{ needs.build_single_arch.outputs.alias }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${ALIAS}" \
            "${IMAGE}:${ALIAS}-amd64" \
            "${IMAGE}:${ALIAS}-arm64"

      - name: Manifest summary
        env:
          IMAGE: ${{ needs.build_single_arch.outputs.image }}
          VERSION: ${{ needs.build_single_arch.outputs.version }}
          ALIAS: ${{ needs.build_single_arch.outputs.alias }}
        run: |
          echo "### Multi-arch Manifest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" >> $GITHUB_STEP_SUMMARY
          if [ -n "$ALIAS" ]; then
            docker buildx imagetools inspect "${IMAGE}:${ALIAS}" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
